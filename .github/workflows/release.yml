name: Release Antigravity App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.1)'
        required: false
        default: 'v0.1.1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Desktop Platforms: Windows (.msi, .exe), macOS (.dmg), Linux (.deb, .AppImage)
  # -------------------------------------------------------------
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          - platform: windows-latest
            args: ''
            target: ''
          - platform: ubuntu-22.04
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            javascriptcoregtk-4.1 \
            libsoup-3.0-dev

      - name: Install Bun Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build Frontend
        run: bun run build

      - name: Build Desktop Release & Publish to GitHub
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'Antigravity App ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            ## Antigravity App ${{ github.event.inputs.version || github.ref_name }} — Pure-Native Multi-Platform Release

            > **100% of code crafted by Gemini 4 Neon** · Portal & Download Hub: https://antigravity.yterm.cn

            ### Highlights
            - **Pure-Native Tauri v2 + Rust Engine**: Zero WebView DOM injection — speaks Google Antigravity's native `application/json+protobuf` (`boq-jetski` + `LanguageServerService`) protocol directly in Rust.
            - **Multi-Account × Multi-Device Concurrent Aggregation**: View all remote workstations and live coding sessions in one unified feed (`Unified` / `By Account` / `By Device`).
            - **Adaptive Claude Mobile & Desktop UX**: Persistent `280px` split-pane sidebar on Desktop (`>= 1024px`); touch-ergonomic swipe drawer, bottom sheets, edge-to-edge safe-area & IME insets on Android.
            - **Cookie-First Onboarding + Live Verification + AES-256-GCM Cloud Sync**: Import Cookies via text, `Copy as cURL`, Cookie-Editor JSON, or Netscape `cookies.txt` — live-verified against Google Antigravity before pushing to encrypted Cloud Vault (`https://antigravity.yterm.cn`), with 1-Tap Google OIDC SSO on Desktop & Android (`antigravity://auth/callback`).
            - **Two-Tier Auto-Updater**: ~140 KB incremental `web-bundle.tar.gz` delta updates + SHA-256 verified full native installers.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # -------------------------------------------------------------
  # Android: .apk & .aab
  # -------------------------------------------------------------
  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Rust & Android Toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Bun Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build Pure-Native Frontend & Incremental Web Bundle
        run: |
          bun run build
          tar -czf web-bundle.tar.gz -C dist .

      - name: Build Android Release APK
        run: bun run tauri android build --apk

      - name: Generate Signed Update Manifest (update-manifest.json)
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          APK_PATH=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk 2>/dev/null | head -n 1 || true)
          APK_NAME=$(basename "$APK_PATH")
          APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK_PATH")
          WEB_SHA=$(sha256sum web-bundle.tar.gz | awk '{print $1}')
          WEB_SIZE=$(stat -c%s web-bundle.tar.gz)
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          bun -e '
            const fs = require("fs");
            const base = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}`;
            const manifest = {
              version: process.env.VERSION,
              minNativeVersion: "2.0.0",
              notes: `Antigravity Native ${process.env.TAG} release`,
              pubDate: process.env.PUB_DATE,
              webBundle: {
                name: "web-bundle.tar.gz",
                url: `${base}/web-bundle.tar.gz`,
                size: Number(process.env.WEB_SIZE),
                sha256: process.env.WEB_SHA
              },
              androidApk: process.env.APK_NAME ? {
                name: process.env.APK_NAME,
                url: `${base}/${process.env.APK_NAME}`,
                size: Number(process.env.APK_SIZE),
                sha256: process.env.APK_SHA
              } : null
            };
            fs.writeFileSync("update-manifest.json", JSON.stringify(manifest, null, 2));
          ' VERSION="$VERSION" APK_NAME="$APK_NAME" APK_SHA="$APK_SHA" APK_SIZE="$APK_SIZE" WEB_SHA="$WEB_SHA" WEB_SIZE="$WEB_SIZE" PUB_DATE="$PUB_DATE"

      - name: Upload Android APK, Incremental Web Bundle & Manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
            web-bundle.tar.gz
            update-manifest.json
