[package]
name = "antigravity-app"
version = "2.0.4"
description = "Pure-Native Antigravity Remote Control Tauri v2 App"
authors = ["Antigravity Team"]
edition = "2021"

[lib]
name = "antigravity_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
